<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイトル（ダイジェスト）</title>
<style>
* { box-sizing: border-box; }
figure { margin: 2em 0; }
figure svg { width: 100%; height: auto; display: block; font-family: inherit; }
figcaption { font-size: 12.5px; margin-top: 8px; text-align: center; }
.src { font-size: 11.5px; font-weight: 500; margin-left: .55em; white-space: nowrap; }
p { margin: 0 0 1.15em; }
ul, ol { padding-left: 1.5em; margin: 0 0 1.2em; }
li { margin: .4em 0; }
.docfoot { font-size: 12px; margin-top: 48px; }

:root {
  --ink: #37352f; --sub: #787774; --accent: #337ea9; --line: #e9e9e7;
  --f1: #f1f5f8; --f2: #e0ecf2; --f3: #c3dcea; --f4: #a3cbe0;
  --s1: #d5e3ec; --s2: #b0cfe0; --s3: #7fb0cc;
}
body { margin: 0; background: #ffffff; color: var(--ink);
  font-family: ui-sans-serif, -apple-system, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px; line-height: 1.9; }
main { max-width: 700px; margin: 0 auto; padding: 64px 20px 120px; }
.kicker { color: var(--sub); font-size: 12px; font-weight: 500; letter-spacing: .1em; }
h1 { font-size: 34px; font-weight: 700; line-height: 1.35; margin: 8px 0 8px; letter-spacing: -.01em; }
.lede { color: var(--sub); font-size: 14.5px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
h2 { font-size: 23px; font-weight: 700; line-height: 1.4; margin: 2.8em 0 .6em; letter-spacing: -.01em; }
h3 { font-size: 17.5px; font-weight: 700; margin: 1.9em 0 .5em; }
.src { color: #b9b7b3; }
.thesis { margin: 1.8em 0; padding: 16px 16px 16px 14px; background: #ddebf1;
  border-radius: 4px; font-weight: 700; font-size: 16.5px; color: #264653; }
.thesis::before { content: "💡"; margin-right: 10px; }
.note { margin: 1.4em 0; padding: 14px 16px 14px 14px; background: #f1f1ef;
  border-radius: 4px; font-size: 14.5px; color: var(--ink); }
.note::before { content: "📌"; margin-right: 10px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.src a, .meta-table a { color: inherit; }
.src a:hover, .meta-table a:hover { color: var(--accent); }
table { border-collapse: collapse; width: 100%; margin: 1.3em 0; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
th { background: #f7f6f3; font-weight: 600; white-space: nowrap; }
.takeaway { background: #f7f6f3; border-radius: 4px; padding: 18px 26px; margin: 1.5em 0; }
.takeaway ol { margin: 0; }
li::marker { color: var(--sub); }
figcaption, .docfoot { color: #b9b7b3; }
</style>
</head>
<body>
<main>
<div class="kicker">READING DIGEST NN</div>
<h1>テーマ名</h1>
<p class="lede">元資料の説明を1文で。出典は見出し横に記載。</p>

<table class="meta-table">
<tr><th>320</th><td><a href="https://example.com/original">元記事タイトル</a>（2026-07-19・幹）</td></tr>
<tr><th>252</th><td><a href="https://example.com/original2">補記事タイトル</a>（2026-04-05）</td></tr>
</table>

<div class="thesis">文書全体を貫く中心主張を1文で。</div>

<h2>節タイトル<span class="src"><a href="https://example.com/original">320</a>・<a href="https://example.com/original2">252</a></span></h2>
<p>導入の段落。<strong>強調は太字</strong>で。</p>
<ul>

<div class="note"><b>用語:</b> 余談・注意・用語解説はこのブロックに逃がす。</div>

<!-- 図解の例1: 積み層図（層構造・成熟度・段階に使う） -->
<figure>
<svg viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg">
  <g font-size="14">
    <rect x="40" y="20"  width="600" height="42" rx="6" fill="var(--f1)" stroke="var(--s1)"/>
    <rect x="40" y="72"  width="600" height="42" rx="6" fill="var(--f2)" stroke="var(--s2)"/>
    <rect x="40" y="124" width="600" height="42" rx="6" fill="var(--f3)" stroke="var(--s3)"/>
    <text x="60" y="47"  fill="var(--ink)">上の層 <tspan fill="var(--sub)" font-size="12">— 補足</tspan></text>
    <text x="60" y="99"  fill="var(--ink)">中の層 <tspan fill="var(--sub)" font-size="12">— 補足</tspan></text>
    <text x="60" y="151" fill="var(--ink)">下の層 <tspan fill="var(--sub)" font-size="12">— 補足</tspan></text>
  </g>
</svg>
<figcaption>図1 図の要点を1文で</figcaption>
</figure>

    <text x="105" y="56" fill="var(--ink)">役割A</text><text x="105" y="76" font-size="11.5" fill="var(--sub)">説明</text>

<!-- 図解の例3: 2x2マトリクス（2軸の分類に使う）。左右対称に置き、片側に空白を残さない -->
<figure>
<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
  <g font-size="13">
    <rect x="20"  y="50"  width="310" height="95" rx="8" fill="var(--f2)" stroke="var(--s2)"/>
    <rect x="350" y="50"  width="310" height="95" rx="8" fill="var(--f1)" stroke="var(--s1)"/>
    <rect x="20"  y="155" width="310" height="95" rx="8" fill="var(--f3)" stroke="var(--s3)"/>
    <rect x="350" y="155" width="310" height="95" rx="8" fill="var(--f2)" stroke="var(--s2)"/>
    <text x="38" y="75" font-weight="700" fill="var(--ink)">象限A</text>

    <text x="368" y="97" fill="var(--sub)" font-size="12">説明</text>

    <text x="368" y="180" font-weight="700" fill="var(--ink)">象限D</text>

<h2>持ち帰り</h2>
<div class="takeaway">
<ol>
